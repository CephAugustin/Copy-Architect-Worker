
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Factory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              950: 'var(--bg-app)',
              900: 'var(--bg-card)',
              800: '#1b1d26',
            },
            indigo: {
              400: 'var(--indigo-400)',
              500: 'var(--indigo-500)',
              600: 'var(--indigo-600)',
              700: 'var(--indigo-700)',
              950: 'var(--indigo-950)',
            },
            purple: {
              400: 'var(--purple-400)',
              500: 'var(--purple-500)',
              600: 'var(--purple-600)',
              700: 'var(--purple-700)',
              950: 'var(--purple-950)',
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Semantic variables */
      --primary-color: #00F0FF;
      --primary-hover: #00B4C0;
      --primary-light: #80FAFF;
      --secondary-color: #39FF14;
      --secondary-hover: #2BC40E;
      --secondary-light: #9BFF8A;

      --bg-app: #0B0C10;
      --bg-card: #15171E;

      /* Tailwind mappings */
      --indigo-400: var(--primary-light);
      --indigo-500: var(--primary-color);
      --indigo-600: var(--primary-color);
      --indigo-700: var(--primary-hover);
      --indigo-950: #042f2e;
      --purple-400: var(--secondary-light);
      --purple-500: var(--secondary-color);
      --purple-600: var(--secondary-color);
      --purple-700: var(--secondary-hover);
      --purple-950: #052e16;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-app);
      color: #F8FAFC;
      margin: 0;
      overflow-x: hidden;
    }
    .bg-factory-gradient {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%) !important;
      color: #ffffff !important;
      border: none !important;
      font-weight: 900 !important;
      text-transform: uppercase !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.15) !important;
    }
    .bg-factory-gradient:hover {
      transform: scale(1.025) !important;
      filter: brightness(1.1) !important;
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3), 0 0 15px rgba(57, 255, 20, 0.2) !important;
    }
    .bg-factory-gradient:active {
      transform: scale(0.975) !important;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-card);
      border: 1px solid var(--primary-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
